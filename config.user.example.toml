# 一个人的个人配置：scripts/add-user.sh 会复制到 users/<名字>/config.toml。
# 共用的设置（模型、默认订阅源等）在 config.shared.toml；这里写的值优先。
# token 和用户 id 不写在这里，写在同一目录的 .env 里。

# 聊天渠道：至少开一个
[discord]
enabled = true

[telegram]
enabled = false

# 这个人的“家”。旅行时可以在聊天里用 /city 临时切换，/home 恢复
[brief]
timezone = "Pacific/Auckland"
city = "Auckland"
latitude = -36.85
longitude = 174.76

[calendar]
ics_urls = []   # 私人日历的 .ics 链接，是秘密，只写在这里

[news]
interests = []     # 感兴趣的话题，例如 ["新西兰本地政策", "AI 和开发工具"]
avoid = []         # 不想看的话题，例如 ["体育", "名人八卦"]
extra_feeds = []   # 在共用订阅源之外再加的，写法和 feeds 一样，例如 [{ url = "https://…", name = "短名" }]

# 待办：markdown 是 data/ 里的 todo.md（用 /add、/done 管理）；ms_todo 是 Microsoft To Do，只读（README 第 18 节）
[todo]
backend = "markdown"
lists = []   # ms_todo 时读哪些列表，例如 ["Tasks", "Work"]；不写就读默认列表
brief_days = 3   # ms_todo 时早报只写已过期、今天和这么多天内截止的待办；/todo 仍然列出全部

[monitor]
healthcheck_url = ""   # 可选，这个人自己的健康检查地址，例如 healthchecks.io 的 ping 地址（README 第 17 节）
