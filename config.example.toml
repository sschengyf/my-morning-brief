[paths]
data_dir = "data"   # 程序产生的所有数据（todo.md、ms-token.json、archive/、schedules.json、state.json、location.json、app.lock）都在这里；相对路径按项目根目录解析。Docker 把数据卷挂到这个目录

# 聊天渠道：至少开一个。两个都开时，早报两边都发；在哪边提问就在哪边回复
[telegram]
enabled = false
bot_token = "在这里填 BotFather 给你的 token"   # 也可以用环境变量 TELEGRAM_BOT_TOKEN 提供，环境变量优先
chat_id = 0          # 先留 0，启动后给机器人发 /start 获取；也可以用环境变量 TELEGRAM_CHAT_ID

[discord]
enabled = true
bot_token = "在这里填 Discord Developer Portal 里 Bot 页面的 token"   # 也可以用环境变量 DISCORD_BOT_TOKEN
user_id = ""         # 你的 Discord 用户 ID，一串数字，要加引号。先留空，启动后私信机器人任意一句获取；也可以用环境变量 DISCORD_USER_ID

[ollama]
host = "http://localhost:11434"
model = "填你的模型名"   # 和 `ollama list` 显示的名字一致，例如 qwen3:32b（不写标签时等同于 :latest）
temperature = 0.3
think = false           # 关闭推理模型的思考过程，速度快很多；模型不支持思考模式时自动忽略
timeout_seconds = 600   # 写早报和聊天回复的超时
num_ctx = 16384         # Ollama 默认上下文很短，超长时会静默截断输入，必须显式设置
keep_alive = "30m"      # 早报后模型保留在内存里，方便接着聊天

[brief]
# 发送时间不在这里设置：在聊天里用 /schedule add 08:00 设置（可以设多个），存在 data/schedules.json
weekend_news = true        # false 时周末早报不抓新闻，也不包含新闻小节
catch_up_hours = 4         # 电脑睡过了某个定时，醒来后几小时内仍补发；不超过下一个定时，也不跨过午夜
retry_minutes = [2, 5, 10] # 生成或发送失败后的重试间隔（仍在补发窗口内）
# 以下是“家”的时区和位置。旅行时可以在聊天里用 /city 临时切换，/home 恢复为这里的设置
timezone = "Pacific/Auckland"
city = "Auckland"
latitude = -36.85
longitude = 174.76

[calendar]
ics_urls = []   # 可以填多个；webcal:// 自动转成 https://

[news]
max_items_per_feed = 10
max_age_hours = 48     # 只要最近多少小时内发布的条目；没有发布时间的条目保留
select_count = 40      # 候选池：按源轮流挑出这么多条交给模型筛选；源多时调大，让每个源都有机会
brief_count = 10       # 早报里写几条新闻，由模型从候选池里挑；不能大于 select_count，不写时取 10 和 select_count 中小的那个
dedup_days = 3         # 最近几天的早报里已经用过的新闻不再出现；0 表示不去重
# 每项可以只写地址（早报里的来源用 feed 自己的标题），也可以写成 { url = "…", name = "短名" }。
# 名字不要写成域名的样子（interest.co.nz 写成 interest）；几个源可以用同一个名字。
feeds = [
  { url = "https://feeds.bbci.co.uk/zhongwen/simp/rss.xml", name = "BBC 中文" },
  { url = "https://www.rnz.co.nz/rss/national.xml", name = "RNZ" },
  { url = "https://hnrss.org/frontpage?points=200", name = "Hacker News" },
  "https://karpathy.bearblog.dev/feed/",   # Andrej Karpathy 的博客（Atom 格式）
]
interests = []                # 感兴趣的话题，模型挑新闻时优先选，例如 ["新西兰本地政策", "AI 和开发工具", "奥克兰交通"]
avoid = []                    # 不想看的话题，除非是大新闻否则不选，例如 ["体育", "名人八卦"]
select_timeout_seconds = 120  # 模型筛选新闻的超时，超时或失败就用按源轮流的前 brief_count 条

[todo]
backend = "markdown"   # markdown：下面的 todo.md，用 /add、/done 管理；ms_todo：Microsoft To Do，只读（README 第 18 节）
file = "todo.md"   # markdown 用。相对路径按 data_dir 解析，支持 ~ 和绝对路径
lists = []         # ms_todo 用：读哪些列表，例如 ["Tasks", "Work"]；不写就读默认列表
urgent_days = 3    # ms_todo 用：几天内截止算紧急；早报只写紧急的待办，/todo 按艾森豪威尔矩阵列出全部

[microsoft]
client_id = ""   # ms_todo 用：Azure 应用注册里的“应用程序（客户端）ID”，不是机密

[archive]
dir = "archive"        # 相对路径按 data_dir 解析
retention_days = 90    # 超过天数的归档在每天发送早报后删除；0 表示永久保留

[monitor]
healthcheck_url = ""   # 可选，例如 healthchecks.io 的 ping 地址，定时早报发出后请求一次（README 第 17 节）
